{% extends "base.html" %}
{% block title %}Sign Out — AMS{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-24">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 w-full max-w-sm text-center">
        <h1 class="text-xl font-bold text-gray-800 mb-2">Sign Out</h1>
        <p class="text-gray-500 text-sm mb-6">Are you sure you want to sign out of AMS?</p>
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded-lg transition">
                Sign Out
            </button>
        </form>
        <a href="{% url 'approvals:inbox' %}" class="mt-4 inline-block text-sm text-indigo-600 hover:underline">
            Cancel
        </a>
    </div>
</div>
{% endblock %}
